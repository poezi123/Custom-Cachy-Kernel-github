---
# Haupt-Schritt: das komplette Live-Dateisystem auf die Platte.
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    # Absicherung: mkarchiso kopiert Kernel/initramfs nach arch/boot/ heraus.
    # Falls sie dabei aus dem airootfs verschwinden, holen wir sie hier zurueck.
    # optional:true -> kein Abbruch, wenn sie ohnehin schon im squashfs sind.
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux-leon"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux-leon"
        optional: true
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux-cachyos-lts"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux-cachyos-lts"
        optional: true
