# Deutsches Layout fuer X11 und XWayland. Hyprland liest das NICHT - dafuer
# sorgt set-keyboard-layout.service. Diese Datei greift fuer X-Anwendungen,
# die unter XWayland laufen (z.B. Ghidra, VirtualBox).
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "de"
EndSection
