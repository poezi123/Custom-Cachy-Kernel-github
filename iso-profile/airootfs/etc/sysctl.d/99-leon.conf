# Sortiert nach cachyos-settings -> diese Werte gewinnen.

# --- Speicher: zram bevorzugen ---------------------------------------------
# vm.swappiness steht hier bewusst NICHT.
# cachyos-settings setzt ihn per udev-Regel, sobald zram bereit ist:
#   /usr/lib/udev/rules.d/30-zram.rules
#   ACTION=="change", KERNEL=="zram0", ... SYSCTL{vm.swappiness}="150"
# Diese Regel laeuft NACH systemd-sysctl und gewinnt daher immer. Ein Wert an
# dieser Stelle waere wirkungslos und nur irrefuehrend.
# Zum Aendern: eigene Regel /etc/udev/rules.d/31-zram-swappiness.rules anlegen
# (31 sortiert nach 30 und gewinnt), oder die Zeile in der CachyOS-Regel ersetzen.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# --- Dev-Workloads ----------------------------------------------------------
# IDEs/Watcher (VSCode, cargo-watch) laufen sonst in "too many open files"
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 8192
fs.file-max = 2097152

# perf/eBPF-Profiling ohne root. Auf einem Einzelplatz-Laptop vertretbar;
# auf Mehrbenutzersystemen waere 2 die richtige Wahl.
kernel.perf_event_paranoid = 1

# --- Haertung ---------------------------------------------------------------
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
# ptrace_scope=1: gdb kann selbst gestartete Prozesse debuggen, aber sich nicht
# an fremde laufende Prozesse haengen. Fuer Attach an fremde PIDs: sudo gdb -p
kernel.yama.ptrace_scope = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.tcp_syncookies = 1

# --- Netz: BBRv3 ist im Kernel Default, hier nur der passende Qdisc ---------
net.core.default_qdisc = fq
