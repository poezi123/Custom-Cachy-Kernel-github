# RTX 4060 Laptop (Ada, AD107) - Hybridbetrieb mit 780M
#
# NVreg_DynamicPowerManagement=0x02
#   Feingranulares Runtime-PM inkl. D3cold: die dGPU faellt auf ~0.5 W statt
#   ~12 W, sobald kein Prozess sie nutzt. Das ist der grosse Akku-Hebel.
# NVreg_PreserveVideoMemoryAllocations=1
#   VRAM wird bei Suspend in den RAM gesichert. Ohne das kippen laufende
#   CUDA-Kontexte (z.B. eine lange hashcat-Session) beim Suspend.
options nvidia NVreg_DynamicPowerManagement=0x02 NVreg_PreserveVideoMemoryAllocations=1

# modeset=1 ist Pflicht fuer PRIME-Offload unter Wayland.
options nvidia_drm modeset=1 fbdev=1
