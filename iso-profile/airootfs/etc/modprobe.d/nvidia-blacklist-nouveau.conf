# Der CachyOS-Default leitete "modprobe nvidia" auf einen Loader um, der per
# "chwd --list" nach dem Paket nvidia-open-dkms sucht. Wir liefern das
# NVIDIA-Open-Modul aber IM Kernelpaket (linux-leon-nvidia-open), nicht als
# DKMS. Der Loader haette es nicht gefunden und waere auf nouveau
# zurueckgefallen -> kein CUDA, kein hashcat.
#
# Hardware ist bekannt und fest: RTX 4060 Laptop (Ada, AD107). Deshalb
# nouveau hart aus und die nvidia-Module direkt laden lassen.
blacklist nouveau
options nouveau modeset=0
