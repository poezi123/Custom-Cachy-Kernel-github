# Gehaertet gegenueber dem CachyOS-Default.
# Original erlaubte PermitRootLogin yes + PasswordAuthentication yes bei
# LEEREM root-Passwort -> passwortloses Root-SSH in jedem Netz.
#
# sshd startet ausserdem nicht mehr automatisch:
#   bei Bedarf  ->  sudo systemctl start sshd
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
X11Forwarding no
