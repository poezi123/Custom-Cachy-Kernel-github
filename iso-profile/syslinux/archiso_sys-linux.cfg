LABEL leon
TEXT HELP
CachyOS 8845HS mit dem eigenen Kernel linux-leon (znver4 + LTO + BORE).
Setzt eine Zen-4-CPU voraus.
ENDTEXT
MENU LABEL CachyOS 8845HS - linux-leon (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-leon
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-leon.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=pcspkr amdgpu.modeset=1 nvme_load=yes amd_pstate=active nowatchdog split_lock_detect=off amd_iommu=on iommu=pt zswap.enabled=0

LABEL cos64
TEXT HELP
Boot the CachyOS install medium on BIOS.
It allows you to install CachyOS or perform system maintenance.
ENDTEXT
MENU LABEL Rettungskernel - LTS generisch (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=pcspkr amdgpu.modeset=1 nvme_load=yes

# Fallback (nomodeset)
LABEL cos64fb
TEXT HELP
Boot the CachyOS install medium on Bios in fallback mode
It allows you to install CachyOS or perform system maintenance.
ENDTEXT
MENU LABEL CachyOS Fallback (nomodeset, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes
